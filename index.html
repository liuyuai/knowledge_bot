<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库机器人</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .chat-container {
    width: 100%;
    max-width: 720px;
    height: 90vh;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    padding: 16px 24px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .new-chat-btn {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .new-chat-btn:hover { background: rgba(255,255,255,0.3); }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; }
  .msg.user { align-self: flex-end; background: #667eea; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #f0f0f0; color: #1a1a1a; border-bottom-left-radius: 4px; white-space: pre-wrap; }
  .sources { margin-top: 8px; font-size: 12px; color: #888; }
  .sources span { display: inline-block; background: #e8e8e8; padding: 2px 8px; border-radius: 4px; margin-right: 6px; margin-top: 4px; }
  .input-area { padding: 16px 24px; border-top: 1px solid #eee; display: flex; gap: 10px; }
  .input-area input {
    flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 10px;
    font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .input-area input:focus { border-color: #667eea; }
  .input-area button {
    padding: 12px 24px; background: #667eea; color: #fff; border: none;
    border-radius: 10px; font-size: 14px; cursor: pointer; transition: opacity 0.2s;
  }
  .input-area button:hover { opacity: 0.9; }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { color: #999; font-style: italic; }
  .agent-steps { margin-bottom: 8px; min-height: 4px; }
  .agent-step {
    display: inline-block;
    background: rgba(102,126,234,0.12);
    color: #667eea;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    margin-right: 6px;
    margin-bottom: 4px;
  }
  .agent-thought {
    background: rgba(250,173,20,0.1);
    color: #b8860b;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 6px;
    line-height: 1.5;
    border-left: 3px solid rgba(250,173,20,0.4);
  }
  .reflection-badge {
    display: inline-block;
    background: rgba(82,196,26,0.12);
    color: #52c41a;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    margin-top: 4px;
  }
  .agent-answer { min-height: 20px; position: relative; font-size: 14px; line-height: 1.6; color: #1a1a1a; }
  .agent-answer * { font-family: inherit; font-size: inherit; line-height: inherit; }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 14px;
    background: #667eea;
    margin-left: 2px;
    animation: blink 1s infinite;
    vertical-align: middle;
  }
  @keyframes blink { 0%,50% {opacity:1} 51%,100% {opacity:0} }
  .agent-answer p { margin: 0 0 8px 0; }
  .agent-answer p:first-child { margin-top: 0; }
  .agent-answer p:last-child { margin-bottom: 0; }
  .agent-answer strong { font-weight: 600; }
  .agent-answer em { font-style: italic; }
  .agent-answer code { background: #e8e8e8; padding: 1px 6px; border-radius: 4px; font-size: 13px; font-family: Consolas, monospace; }
  .agent-answer pre { background: #1a1a1a; color: #e4e3dd; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
  .agent-answer pre code { background: none; padding: 0; color: inherit; }
  .agent-answer ul, .agent-answer ol { margin: 8px 0; padding-left: 22px; }
  .agent-answer li { margin: 4px 0; }
  .agent-answer h1, .agent-answer h2, .agent-answer h3 { font-weight: 600; margin: 12px 0 6px; }
  .agent-answer h1 { font-size: 18px; }
  .agent-answer h2 { font-size: 16px; }
  .agent-answer h3 { font-size: 15px; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <span>知识库机器人</span>
    <button class="new-chat-btn" onclick="newChat()">新对话</button>
  </div>
  <div class="messages" id="messages">
    <div class="msg bot">你好！我可以基于你的知识库回答问题。请问有什么想了解的？</div>
  </div>
  <div class="input-area">
    <input type="text" id="question" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const API = window.location.protocol === "file:" ? "http://localhost:8000" : "";
marked.setOptions({ breaks: true });  // 换行转 <br>

// 会话 ID：优先从 localStorage 恢复，没有则新建
let sessionId = localStorage.getItem("kb_session_id");
if (!sessionId) {
  sessionId = "sess-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  localStorage.setItem("kb_session_id", sessionId);
}

// 页面加载时恢复历史对话
async function loadHistory() {
  try {
    const resp = await fetch(API + "/history?session_id=" + encodeURIComponent(sessionId));
    const data = await resp.json();
    const history = data.history || [];
    if (history.length === 0) return;

    const msgs = document.getElementById("messages");
    msgs.innerHTML = ""; // 清空默认欢迎语
    for (const msg of history) {
      if (msg.role === "user") {
        msgs.innerHTML += `<div class="msg user">${escapeHtml(msg.content)}</div>`;
      } else if (msg.role === "assistant") {
        const botDiv = document.createElement("div");
        botDiv.className = "msg bot";
        const answerDiv = document.createElement("div");
        answerDiv.className = "agent-answer";
        const answerText = document.createElement("div");
        answerText.className = "answer-text";
        answerText.innerHTML = marked.parse(msg.content || "");
        answerDiv.appendChild(answerText);
        botDiv.appendChild(answerDiv);
        msgs.appendChild(botDiv);
      }
    }
    msgs.scrollTop = msgs.scrollHeight;
  } catch (e) {
    // 拉取失败就用默认欢迎语，不报错
  }
}

// 页面加载完成后恢复历史
document.addEventListener("DOMContentLoaded", loadHistory);

async function newChat() {
  // 清空后端会话历史
  try {
    await fetch(API + "/clear", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: "", session_id: sessionId})
    });
  } catch (e) {}
  // 重新生成会话 ID，清空 localStorage 和页面消息
  sessionId = "sess-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  localStorage.setItem("kb_session_id", sessionId);
  document.getElementById("messages").innerHTML = '<div class="msg bot">你好！我可以基于你的知识库回答问题。请问有什么想了解的？</div>';
}

async function send() {
  const input = document.getElementById("question");
  const btn = document.getElementById("sendBtn");
  const msgs = document.getElementById("messages");
  const q = input.value.trim();
  if (!q) return;

  // 用户消息
  msgs.innerHTML += `<div class="msg user">${escapeHtml(q)}</div>`;
  input.value = "";
  btn.disabled = true;

  // 创建 bot 消息容器（步骤区 + 回答区 + 来源区）
  const botDiv = document.createElement("div");
  botDiv.className = "msg bot";
  const stepsDiv = document.createElement("div");
  stepsDiv.className = "agent-steps";
  const answerDiv = document.createElement("div");
  answerDiv.className = "agent-answer";
  const answerText = document.createElement("div");
  answerText.className = "answer-text";
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  answerDiv.appendChild(answerText);
  answerDiv.appendChild(cursor);
  const sourcesDiv = document.createElement("div");
  sourcesDiv.className = "sources";
  botDiv.appendChild(stepsDiv);
  botDiv.appendChild(answerDiv);
  botDiv.appendChild(sourcesDiv);
  msgs.appendChild(botDiv);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const resp = await fetch(API + "/ask/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: q, session_id: sessionId})
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let fullAnswer = "";

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});

      // SSE 事件以空行分隔
      const events = buffer.split("\n\n");
      buffer = events.pop(); // 保留不完整的事件

      for (const evt of events) {
        const lines = evt.split("\n");
        let eventType = "message";
        let data = "";
        for (const line of lines) {
          if (line.startsWith("event:")) eventType = line.slice(6).trim();
          if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        const parsed = JSON.parse(data);

        if (eventType === "thought") {
          const thoughtEl = document.createElement("div");
          thoughtEl.className = "agent-thought";
          thoughtEl.textContent = "💭 " + parsed.content;
          stepsDiv.appendChild(thoughtEl);
        } else if (eventType === "tool") {
          const stepEl = document.createElement("span");
          stepEl.className = "agent-step";
          stepEl.textContent = "🤖 " + parsed.name;
          stepsDiv.appendChild(stepEl);
        } else if (eventType === "token") {
          fullAnswer += parsed.content;
          answerText.innerHTML = marked.parse(fullAnswer);
          msgs.scrollTop = msgs.scrollHeight;
        } else if (eventType === "reflection") {
          // 反省功能已注释，需要时取消注释
          // fullAnswer = parsed.content;
          // answerText.innerHTML = marked.parse(fullAnswer);
          // const correctedEl = document.createElement("div");
          // correctedEl.className = "reflection-badge";
          // correctedEl.textContent = "✓ 已自检修正";
          // stepsDiv.appendChild(correctedEl);
        } else if (eventType === "done") {
          cursor.remove();
          if (parsed.sources && parsed.sources.length) {
            const unique = [...new Set(parsed.sources)];
            sourcesDiv.innerHTML = "来源：" + unique.map(s => `<span>${escapeHtml(s)}</span>`).join("");
          }
        } else if (eventType === "error") {
          cursor.remove();
          answerText.innerHTML = '<span style="color:#e74c3c">出错了：' + escapeHtml(parsed.error) + '</span>';
        }
      }
    }
  } catch (e) {
    cursor.remove();
    answerText.innerHTML = '<span style="color:#e74c3c">请求失败：' + escapeHtml(e.message) + '</span>';
    sourcesDiv.textContent = "请确认后端服务已启动（python dev.py）";
  }

  btn.disabled = false;
  msgs.scrollTop = msgs.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
